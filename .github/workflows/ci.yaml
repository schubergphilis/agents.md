name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISABLE_TELEMETRY: "1"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: All skills are discoverable
        run: |
          found=$(npx -y skills@1.7.0 add ./ --list | grep -cE '^│    [a-z]')
          expected=$(ls -d skills/*/ | wc -l)
          echo "found=$found expected=$expected"
          test "$found" -eq "$expected"
      - name: Pack fragments under 300 words
        run: |
          for f in packs/*/AGENTS.md; do
            n=$(wc -w < "$f")
            [ "$n" -lt 300 ] || { echo "$f has $n words"; exit 1; }
          done
