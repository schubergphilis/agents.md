<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyebrow & Mono</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'TT Interphases', system-ui, sans-serif;
      padding: 24px;
      background: white;
    }
    .specimen {
      margin-bottom: 24px;
    }
    .specimen-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #5A6782;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .eyebrow-light {
      font-family: 'TT Interphases Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #1EE8ED;
      letter-spacing: 0.02em;
    }
    .eyebrow-dark {
      font-family: 'TT Interphases Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #E8F2FD;
      letter-spacing: 0.02em;
      background: #082646;
      padding: 12px 16px;
      border-radius: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="specimen">
    <div class="specimen-label">Eyebrow on light (10pt Mono Bold)</div>
    <div class="eyebrow-light">Statement & framing - P1.1 - Single key message</div>
  </div>
  
  <div class="specimen">
    <div class="specimen-label">Eyebrow on dark (10pt Mono Bold)</div>
    <div class="eyebrow-dark">M01.58 - Matrix - Maturity heat</div>
  </div>
</body>
</html>
