<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pull Quote Slide</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: white;
    }
    .slide {
      width: 1280px;
      height: 720px;
      background: white;
      position: relative;
      font-family: 'TT Interphases', system-ui, sans-serif;
    }
    .eyebrow {
      position: absolute;
      left: 37.8px;
      top: 30.24px;
      font-family: 'TT Interphases Mono', monospace;
      font-size: 13.33px;
      font-weight: 700;
      color: #1EE8ED;
      letter-spacing: 0.02em;
    }
    .title {
      position: absolute;
      left: 37.8px;
      top: 60.48px;
      width: 1204.4px;
      font-size: 29.33px;
      font-weight: 900;
      line-height: 1.1;
      color: #020C17;
    }
    .marker-bar {
      position: absolute;
      left: 37.8px;
      top: 132.3px;
      width: 56.7px;
      height: 3.78px;
      background: #1E80ED;
    }
    .subhead {
      position: absolute;
      left: 37.8px;
      top: 144px;
      width: 1204.4px;
      font-size: 16px;
      font-weight: 700;
      color: #020C17;
    }
    .quote-panel {
      position: absolute;
      left: 37.8px;
      top: 174px;
      width: 1204.4px;
      height: 472.5px;
      background: #020C17;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px;
    }
    .quote-marker {
      width: 64.26px;
      height: 3.78px;
      background: #FFDB4E;
      margin-bottom: 30px;
    }
    .quote-text {
      font-size: 45.33px;
      font-weight: 900;
      color: white;
      text-align: center;
      line-height: 1.2;
      margin-bottom: 24px;
    }
    .quote-attribution {
      font-size: 14.67px;
      color: #E8F2FD;
      text-align: center;
    }
    .footer-left {
      position: absolute;
      left: 400.68px;
      bottom: 49.14px;
      font-size: 12px;
      color: #082646;
    }
    .footer-page {
      position: absolute;
      right: 49.14px;
      bottom: 49.14px;
      font-size: 12px;
      color: #5A6782;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="eyebrow">Statement & framing - P1.1 - Single key message</div>
    <div class="title">Success depends on cultural transformation</div>
    <div class="marker-bar"></div>
    <div class="subhead">Technology is necessary but not sufficient</div>
    
    <div class="quote-panel">
      <div class="quote-marker"></div>
      <div class="quote-text">The tools enable the change, but people and processes determine whether it succeeds</div>
      <div class="quote-attribution">Key finding from stakeholder interviews</div>
    </div>
    
    <div class="footer-left">Schuberg Philis  |  Strategic planning</div>
    <div class="footer-page">8</div>
  </div>
</body>
</html>
