<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Divider</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #082646;
    }
    .slide {
      width: 1280px;
      height: 720px;
      background: #082646;
      position: relative;
      color: white;
      font-family: 'TT Interphases', system-ui, sans-serif;
    }
    .marker-bar {
      position: absolute;
      left: 56.7px;
      top: 56.7px;
      width: 56.7px;
      height: 3.78px;
      background: #FFDB4E;
    }
    .eyebrow {
      position: absolute;
      left: 56.7px;
      top: 68px;
      font-family: 'TT Interphases Mono', monospace;
      font-size: 13.33px;
      font-weight: 700;
      color: #E8F2FD;
      letter-spacing: 0.02em;
    }
    .title {
      position: absolute;
      left: 56.7px;
      top: 280px;
      width: 1152px;
      font-size: 48px;
      font-weight: 900;
      line-height: 1.1;
      color: #FFFFFF;
    }
    .subhead {
      position: absolute;
      left: 56.7px;
      top: 385px;
      width: 1152px;
      font-size: 18.67px;
      font-weight: 400;
      color: #1EE8ED;
      line-height: 1.4;
    }
    .footer {
      position: absolute;
      left: 56.7px;
      bottom: 75.6px;
      font-size: 13.33px;
      color: #E8F2FD;
    }
  </style>
</head>
<body>
  <div class="slide">
    <div class="marker-bar"></div>
    <div class="eyebrow">Chapter 2 - Technical assessment</div>
    <div class="title">Three strategic options for cloud migration</div>
    <div class="subhead">Each option assessed against risk, timeline, and expected ROI</div>
    <div class="footer">Schuberg Philis  |  Strategic planning</div>
  </div>
</body>
</html>
