# Auto-detection rules: file patterns activate domain packs
# Only list packs that have content in packs/

[python]
files = ["pyproject.toml", "setup.py", "requirements.txt"]
pack = "python"

[dotnet]
files = ["*.sln", "*.csproj", "Directory.Packages.props"]
pack = "dotnet"

[supply-chain]
files = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
pack = "supply-chain"

[terraform]
files = ["*.tf", "terraform.tf", "versions.tf"]
pack = "terraform"

# Uncomment when packs are created:
# [docker]
# files = ["Dockerfile", "docker-compose.yml", "docker-compose.yaml"]
# pack = "docker"
#
# [kubernetes]
