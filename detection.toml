# Auto-detection rules: file patterns activate domain packs
# Only list packs that have content in packs/

[python]
files = ["pyproject.toml", "setup.py", "requirements.txt"]
pack = "python"

[supply-chain]
files = [".github/workflows/*.yml", ".github/workflows/*.yaml"]
pack = "supply-chain"

